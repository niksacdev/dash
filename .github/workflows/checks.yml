name: DASH checks
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dash-desktop
    steps:
      - name: Verify PR targets main
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if [ "$GITHUB_BASE_REF" != "main" ]; then
            echo "::error::DASH pull requests must target main. Edit the pull request base to main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dash-desktop/package-lock.json
      - run: npm run docs:check
      - run: npm ci
      - name: Build the Finder launcher from a fresh install
        run: |
          npm run package:mac
          test -x node_modules/electron/dist/Electron.app/Contents/MacOS/Electron
      - run: npm run check
      - name: Verify the macOS Finder launcher
        run: node --experimental-strip-types scripts/check-mac-launcher.mts
