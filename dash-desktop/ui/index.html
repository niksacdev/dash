<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>DASH — Domain Assessment &amp; Scoring Harness</title>
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="overview.css" />
    <script defer src="quick-picker.js"></script>
    <script defer src="capabilities.js"></script>
    <script defer src="performance-summary.js"></script>
    <script defer src="opik-experiments.js"></script>
    <script defer src="history.js"></script>
    <script defer src="industries.js"></script>
    <script defer src="catalog.js"></script>
    <link rel="stylesheet" href="prompt-guide.css" />
    <link rel="stylesheet" href="workflow.css" />
    <script defer src="dataset-run.js"></script>
    <script defer src="planning-activity.js"></script>
    <script defer src="workflow.js"></script>
    <script defer src="roster.js"></script>
    <script defer src="grader-designer.js"></script>
    <link rel="stylesheet" href="grader-designer.css" />
    <script defer src="graders.js"></script>
    <script defer src="catalog-test.js"></script>
    <script defer src="quick-grading.js"></script>
    <script defer src="evaluation-report.js"></script>
    <link rel="stylesheet" href="evaluation.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="car" viewBox="0 -18 57 36">
          <g fill="#090909" stroke="#696969">
            <rect x="3" y="-15" width="10" height="8" rx="2" />
            <rect x="3" y="7" width="10" height="8" rx="2" />
            <rect x="36" y="-15" width="10" height="8" rx="2" />
            <rect x="36" y="7" width="10" height="8" rx="2" />
          </g>
          <path
            d="M4-10H20L28-6H45L54-3V3L45 6H28L20 10H4Z"
            fill="currentColor"
            stroke="#FFF5E4"
            stroke-width=".7"
          />
          <path d="M17-6H26L31-3V3L26 6H17L13 3V-3Z" fill="#202020" />
          <path d="M7 0H12M32 0H49" stroke="#FFF5E4" />
          <path d="M1-10V10M52-8V8" stroke="currentColor" stroke-width="4" />
        </symbol>
        <symbol id="finance-i" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v2H3z M5 20h14 M3 22h18 M6 12v6m4-6v6m4-6v6m4-6v6"/></symbol>
        <symbol id="factory-i" viewBox="0 0 24 24"><path d="M3 21V9l7 4V8l7 4 1-9h3v18z M6 17h2m3 0h2m3 0h2"/></symbol>
        <symbol id="home-i" viewBox="0 0 24 24">
          <path d="M3 10l9-7 9 7v10H3z M10 20v-6h4v6" />
        </symbol>
        <symbol id="compare-i" viewBox="0 0 24 24">
          <path d="M3 6h17m-5-4 5 4-5 4M21 18H4m5-4-5 4 5 4" />
        </symbol>
        <symbol id="database-i" viewBox="0 0 24 24">
          <ellipse cx="12" cy="5" rx="8" ry="3" />
          <path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0" />
        </symbol>
        <symbol id="case-i" viewBox="0 0 24 24">
          <rect x="4" y="6" width="16" height="14" rx="2" />
          <path d="M9 6V3h6v3M4 12h16m-10 0v3h4v-3" />
        </symbol>
        <symbol id="runs-i" viewBox="0 0 24 24">
          <path d="M3 18h18M5 15V9m5 6V5m5 10v-4m5 4V3" />
        </symbol>
        <symbol id="candidate-i" viewBox="0 0 24 24">
          <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" />
        </symbol>
        <symbol id="power-i" viewBox="0 0 24 24"><path d="m14 2-9 12h6l-1 8 9-13h-6z"/></symbol>
        <symbol id="hardware-i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4m-6 12v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol>
        <symbol id="device-i" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M9 21h6m-3 0v-4M6 8h5m-5 4h3" />
        </symbol>
      </defs>
    </svg>
    <aside>
      <a href="#home" class="brand" aria-label="DASH home"
        ><img src="assets/dash-mark.svg" alt="">DASH</a
      >
      <div class="railgroup">Workbench</div>
      <nav id="work"></nav>
      <div class="railgroup">Workspace</div>
      <nav id="env"></nav>
      <div class="railfoot">
        <span class="dot"></span> Local workspace<small id="machine"></small>
      </div>
    </aside>
    <div class="desk">
      <header>
        <span class="breadcrumb">DASH <i>/</i> <strong id="crumb">Workbench</strong></span>
        <div class="header-actions">
          <small class="app-version" title="DASH v{{DASH_VERSION}}{{DASH_REVISION}}"><span class="visually-hidden">DASH version </span>v{{DASH_VERSION}}</small>
          <fieldset id="appearance">
            <legend class="visually-hidden">Appearance</legend>
            <label title="Light mode">
              <input class="visually-hidden" type="radio" name="appearance" value="light" checked />
              <span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><b>Light</b></span>
            </label>
            <label title="Dark mode">
              <input class="visually-hidden" type="radio" name="appearance" value="dark" />
              <span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19.8 14.6a8.3 8.3 0 0 1-10.4-10.4 8.4 8.4 0 1 0 10.4 10.4Z"/></svg><b>Dark</b></span>
            </label>
          </fieldset>
          <a href="#new" class="button yellow">＋ New run</a>
        </div>
      </header>
      <main id="screen" tabindex="-1"></main>
    </div>
    <template id="diagram-objective">
      <svg class="flow-diagram" viewBox="0 0 360 72" role="img" aria-label="Manufacturing task objective: flag bearings outside tolerance. Suggested success metrics: percentage of defective parts caught and percentage of good parts incorrectly flagged." preserveAspectRatio="xMinYMid meet">
        <path class="diagram-paper" d="M2 6h108l14 14v44H2z"/>
        <path class="diagram-rule" d="M110 6v14h14"/>
        <text class="diagram-key" x="12" y="22">TASK OBJECTIVE</text>
        <text class="diagram-value" x="12" y="40">Flag out-of-spec</text>
        <text class="diagram-value" x="12" y="56">bearings</text>
        <path class="diagram-wire" d="M124 39h21q8 0 14-6l4-4q4-4 10-4h17m-45 14q8 0 14 6l4 4q4 4 10 4h17"/>
        <circle class="diagram-port" cx="190" cy="25" r="3"/><circle class="diagram-port" cx="190" cy="53" r="3"/>
        <text class="diagram-key" x="204" y="11">SUCCESS METRICS</text>
        <text class="diagram-value" x="204" y="31">Defects caught (%)</text>
        <text class="diagram-value" x="204" y="59">Good parts flagged (%)</text>
        <path class="diagram-sweep" pathLength="100" d="M124 39h21q8 0 14-6l4-4q4-4 10-4h17"/>
      </svg>
    </template>
    <template id="diagram-grading">
      <svg class="flow-diagram" viewBox="0 0 360 72" role="img" aria-label="Each case produces an answer. AI Industry Graders apply the chosen criteria to the answer and produce a case score." preserveAspectRatio="xMinYMid meet">
        <g class="diagram-paper">
          <rect x="4" y="12" width="35" height="24" rx="3"/><rect x="9" y="8" width="35" height="24" rx="3"/><rect x="14" y="4" width="35" height="24" rx="3"/>
        </g>
        <path class="diagram-rule" d="M21 12h18m-18 7h11"/>
        <path class="diagram-wire" d="M53 20h44m-5-4 5 4-5 4m60-4h39m-5-4 5 4-5 4m58-4h40m-5-4 5 4-5 4"/>
        <path class="diagram-paper" d="M109 5h31q3 0 3 3v19q0 3-3 3h-20l-9 7v-7h-2q-3 0-3-3V8q0-3 3-3z"/>
        <path class="diagram-rule" d="M114 14h20m-20 7h14"/>
        <rect class="diagram-paper" x="199" y="4" width="35" height="31" rx="4"/>
        <path class="diagram-rule" d="m205 14 2 2 4-5m3 3h13m-22 9 2 2 4-5m3 3h13"/>
        <path class="diagram-paper" d="M291 4h24l9 9v23h-33z"/><path class="diagram-rule" d="M315 4v9h9m-26 14v-5m6 5V17m6 10v-7"/>
        <g class="diagram-value"><text x="2" y="58">Case</text><text x="100" y="58">Answer</text><text x="216" y="52" text-anchor="middle"><tspan>AI Industry</tspan> <tspan x="216" dy="15">Graders</tspan></text><text x="270" y="58">Case score</text></g>
        <path class="diagram-sweep" pathLength="100" d="M53 20h42m58 0h38m55 0h38"/>
      </svg>
    </template>
    <template id="diagram-report">
      <svg class="flow-diagram" viewBox="0 0 360 72" role="img" aria-label="Example earnings case. Expected basis: GAAP. Returned basis: adjusted. The case fails the basis check." preserveAspectRatio="xMinYMid meet">
        <path class="diagram-rule" d="M2 6h190M2 35h190M2 65h190"/>
        <text class="diagram-key" x="5" y="25">EXPECTED</text><text class="diagram-value" x="90" y="26">GAAP</text>
        <text class="diagram-key" x="5" y="55">RETURNED</text><text class="diagram-value" x="90" y="56">Adjusted</text>
        <path class="diagram-wire" d="M195 19h7q5 0 5 6v4q0 6 7 6h12m-31 16h7q5 0 5-6v-4q0-6 7-6"/>
        <circle class="diagram-alert" cx="238" cy="35" r="8"/><path class="diagram-alert" d="M238 31v5m0 3v.2"/>
        <text class="diagram-key" x="254" y="26">EXAMPLE · FAILED</text>
        <text class="diagram-value" x="254" y="47">Basis mismatch</text>
        <path class="diagram-sweep" pathLength="100" d="M195 51h7q5 0 5-6v-4q0-6 7-6h12"/>
      </svg>
    </template>
    <template id="diagram-hardware">
      <svg class="flow-diagram" viewBox="0 0 360 72" role="img" aria-label="Planned hardware-in-the-loop test. A physical controller sends a drive command to a simulated motor. The simulator returns speed feedback to the controller for the next command." preserveAspectRatio="xMinYMid meet">
        <rect class="diagram-paper" x="2" y="12" width="93" height="45" rx="4"/>
        <text class="diagram-key" x="12" y="29">PHYSICAL</text>
        <text class="diagram-value" x="12" y="47">Controller</text>
        <rect class="diagram-paper" x="265" y="12" width="93" height="45" rx="4"/>
        <text class="diagram-key" x="276" y="29">SIMULATED</text>
        <text class="diagram-value" x="276" y="47">Motor</text>
        <path class="diagram-wire" d="M95 24H264m-7-4 7 4-7 4"/>
        <path class="diagram-wire" d="M265 46H96m7-4-7 4 7 4"/>
        <g class="diagram-value" text-anchor="middle">
          <text x="180" y="16">Drive command</text>
          <text x="180" y="65">Speed feedback</text>
        </g>
        <path class="diagram-sweep" pathLength="100" d="M95 24H264M265 46H96"/>
      </svg>
    </template>
    <div id="msg" role="status" hidden></div>
  </body>
</html>
