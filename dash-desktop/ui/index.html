<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>DASH · Evaluation workbench</title>
    <script src="appearance.js"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="overview.css" />
    <script defer src="quick-picker.js"></script>
    <script defer src="capabilities.js"></script>
    <script defer src="performance-summary.js"></script>
    <script defer src="opik-experiments.js"></script>
    <script defer src="history.js"></script>
    <script defer src="industries.js"></script>
    <script defer src="catalog.js"></script>
    <link rel="stylesheet" href="prompt-guide.css" />
    <link rel="stylesheet" href="workflow.css" />
    <script defer src="dataset-run.js"></script>
    <script defer src="workflow.js"></script>
    <script defer src="roster.js"></script>
    <script defer src="grader-designer.js"></script>
    <link rel="stylesheet" href="grader-designer.css" />
    <script defer src="graders.js"></script>
    <script defer src="quick-grading.js"></script>
    <script defer src="evaluation-report.js"></script>
    <link rel="stylesheet" href="evaluation.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="mark" viewBox="0 0 100 100">
          <rect width="100" height="100" rx="23" fill="#C51F2D" />
          <path
            d="M30 28H53C68 28 76 42 71 56C67 67 57 74 44 74H20L24 62H45C53 62 58 59 60 52C62 46 58 40 51 40H26Z M25 46H47L43 55H21Z"
            fill="#FFF5E4"
          />
          <path d="M74 73H83L87 62H78Z" fill="#FFD33D" />
        </symbol>
        <symbol id="car" viewBox="0 -18 57 36">
          <g fill="#090909" stroke="#696969">
            <rect x="3" y="-15" width="10" height="8" rx="2" />
            <rect x="3" y="7" width="10" height="8" rx="2" />
            <rect x="36" y="-15" width="10" height="8" rx="2" />
            <rect x="36" y="7" width="10" height="8" rx="2" />
          </g>
          <path
            d="M4-10H20L28-6H45L54-3V3L45 6H28L20 10H4Z"
            fill="currentColor"
            stroke="#FFF5E4"
            stroke-width=".7"
          />
          <path d="M17-6H26L31-3V3L26 6H17L13 3V-3Z" fill="#202020" />
          <path d="M7 0H12M32 0H49" stroke="#FFF5E4" />
          <path d="M1-10V10M52-8V8" stroke="currentColor" stroke-width="4" />
        </symbol>
        <symbol id="home-i" viewBox="0 0 24 24">
          <path d="M3 10l9-7 9 7v10H3z M10 20v-6h4v6" />
        </symbol>
        <symbol id="compare-i" viewBox="0 0 24 24">
          <path d="M3 6h17m-5-4 5 4-5 4M21 18H4m5-4-5 4 5 4" />
        </symbol>
        <symbol id="database-i" viewBox="0 0 24 24">
          <ellipse cx="12" cy="5" rx="8" ry="3" />
          <path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0" />
        </symbol>
        <symbol id="case-i" viewBox="0 0 24 24">
          <rect x="4" y="6" width="16" height="14" rx="2" />
          <path d="M9 6V3h6v3M4 12h16m-10 0v3h4v-3" />
        </symbol>
        <symbol id="runs-i" viewBox="0 0 24 24">
          <path d="M3 18h18M5 15V9m5 6V5m5 10v-4m5 4V3" />
        </symbol>
        <symbol id="candidate-i" viewBox="0 0 24 24">
          <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" />
        </symbol>
        <symbol id="power-i" viewBox="0 0 24 24"><path d="m14 2-9 12h6l-1 8 9-13h-6z"/></symbol>
        <symbol id="hardware-i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4m-6 12v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol>
        <symbol id="device-i" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="13" rx="2" />
          <path d="M9 21h6m-3 0v-4M6 8h5m-5 4h3" />
        </symbol>
      </defs>
    </svg>
    <aside>
      <a href="#home" class="brand" aria-label="DASH home"
        ><svg><use href="#mark" /></svg>DASH</a
      >
      <div class="railgroup">Workbench</div>
      <nav id="work"></nav>
      <div class="railgroup">Workspace</div>
      <nav id="env"></nav>
      <div class="railfoot">
        <span class="dot"></span> Local workspace<small id="machine"></small>
      </div>
    </aside>
    <div class="desk">
      <header>
        <span class="breadcrumb">DASH <i>/</i> <strong id="crumb">Workbench</strong></span>
        <div class="header-actions">
          <fieldset id="appearance">
            <legend class="visually-hidden">Appearance</legend>
            <label title="Light mode">
              <input class="visually-hidden" type="radio" name="appearance" value="light" checked />
              <span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><b>Light</b></span>
            </label>
            <label title="Dark mode">
              <input class="visually-hidden" type="radio" name="appearance" value="dark" />
              <span><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19.8 14.6a8.3 8.3 0 0 1-10.4-10.4 8.4 8.4 0 1 0 10.4 10.4Z"/></svg><b>Dark</b></span>
            </label>
          </fieldset>
          <a href="#new" class="button yellow">＋ New run</a>
        </div>
      </header>
      <main id="screen" tabindex="-1"></main>
    </div>
    <div id="msg" role="status" hidden></div>
  </body>
</html>
