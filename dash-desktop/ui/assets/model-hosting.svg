<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 128" width="630" height="128" role="img" aria-labelledby="title desc">
<title id="title">Where models run</title><desc id="desc">Local models run on your device. Frontier closed APIs run on the model provider's infrastructure. Private hosted models run on your organization's infrastructure.</desc>
