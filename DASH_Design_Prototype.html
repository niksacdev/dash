<style>

*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ivory);font:15px var(--sans)}button,select,input{font:inherit}button,a,select,input{outline-offset:4px}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow)}button{cursor:pointer}button[disabled]{cursor:not-allowed;opacity:.45}button,a{touch-action:manipulation}.sprite{display:none}svg{vertical-align:middle}.sr{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden}.top{position:sticky;z-index:5;top:0;background:linear-gradient(96deg,#a31b11,var(--red) 72%,#b72116);height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 29px;border-bottom:1px solid #f7745f45;box-shadow:0 4px 15px #0004}.top .slashes{position:absolute;left:208px;top:0;height:67px;width:145px;background:repeating-linear-gradient(125deg,#fff0 0 9px,#fff1 10px 11px,#fff0 12px 20px);clip-path:polygon(25% 0,100% 0,78% 100%,0 100%);pointer-events:none}.brand{display:flex;align-items:center;gap:12px;color:var(--ivory);text-decoration:none}.brand svg{width:38px;height:38px}.logo{font-size:31px;font-weight:900;font-style:italic;letter-spacing:-1.7px;line-height:1}.top-end{display:flex;gap:14px;align-items:center}.pill,.chip{font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:7px 9px;border:1px solid var(--line);white-space:nowrap}.top .pill{background:#16161638;color:#fff3e8;border-color:#fff6}.btn{border:1px solid var(--line);background:#242424;color:var(--ivory);padding:10px 13px;font-weight:750;border-radius:3px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.btn:hover{background:#3c3b3a}.btn.primary{background:var(--yellow);color:#211805;border-color:transparent}.btn.primary:hover{background:#ffe677}.btn.small{font-size:13px;padding:8px 10px}.btn.quiet{background:transparent}.btn.quiet:hover{background:#ffffff10}.grid{display:grid;grid-template-columns:213px minmax(0,1fr);min-height:calc(100vh - 68px)}aside.side{position:sticky;top:68px;height:calc(100dvh - 68px);background:#1d1d1d;border-right:1px solid var(--line);padding:23px 12px;display:flex;flex-direction:column;gap:19px;overflow:auto}.nav-label{margin:0 0 6px 10px;color:#9c958a;font:700 10px var(--mono);letter-spacing:.16em}.nav a{display:flex;align-items:center;gap:10px;color:#d7d0c5;text-decoration:none;font-size:14px;padding:11px 10px;white-space:nowrap;position:relative;border:1px solid transparent;border-radius:3px}.nav a:hover{background:#ffffff0b}.nav a[aria-current=page]{color:var(--ivory);background:#d82a1c1b;border-color:#e5463633}.nav a[aria-current=page]:before{content:"";height:60%;width:3px;position:absolute;left:-1px;background:var(--red);transform:skewY(-18deg)}.nav svg,.ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.nav a[aria-current=page] svg{color:#ff6858}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:13px 8px 0;color:var(--muted);font-size:11px;line-height:1.55}.side-foot b{display:block;color:var(--ivory);font:700 10px var(--mono);letter-spacing:.12em}.dot{display:inline-block;background:var(--yellow);width:6px;height:6px;margin-right:6px;transform:rotate(45deg)}
main{min-width:0;background:radial-gradient(ellipse at 32% 5%,#5a5753 0%,#474441 17%,#30303000 52%), radial-gradient(ellipse at 91% 61%,#151515 0%,#1d1d1d00 55%),linear-gradient(126deg,#303030,#272727 75%,#1b1b1b);padding:28px clamp(18px,3vw,52px) 40px}.wrap{max-width:1260px;margin:auto}.crumb,.kicker{font:700 11px var(--mono);letter-spacing:.135em;text-transform:uppercase}.crumb{color:#cbc1b2;margin:2px 0 20px}.crumb a{color:inherit}.kicker{color:var(--yellow);margin:0 0 11px}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:23px}.heading h1,.hero h1{letter-spacing:-.06em;font-size:clamp(35px,5vw,68px);line-height:.98;margin:0;font-weight:890;font-style:italic}.heading p:not(.kicker),.hero p:not(.kicker){color:#e0d7ca;max-width:665px;margin:12px 0 0;line-height:1.5}.hero{background:linear-gradient(109deg,#161616 9%,#252525 57%,#2a2523);position:relative;overflow:hidden;min-height:245px;display:flex;align-items:center;border:1px solid #ffffff24;border-left:4px solid var(--red);padding:34px 34px;margin-bottom:19px;border-radius:4px}.hero:after{content:"";position:absolute;inset:0 0 0 48%;background:linear-gradient(125deg,transparent 42%,#d82a1c 42.1% 42.8%,transparent 43% 48%,#d82a1c55 48.1% 62%,#d82a1c22 62.2% 75%,transparent 75.1%),repeating-linear-gradient(125deg,transparent 0 16px,#ffffff0b 17px 18px,transparent 19px 30px);mask-image:linear-gradient(90deg,transparent,#000 28%);pointer-events:none}.hero .copy{z-index:1;position:relative}.hero .tagline{color:var(--yellow)!important;font-style:normal;font-size:17px;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.section{margin-top:24px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.section-title h2,.panel h2{font-size:20px;letter-spacing:-.025em;margin:0}.section-title p,.note,.panel p,.hint{color:var(--muted);line-height:1.5}.section-title p{margin:4px 0 0}.panels{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}.panels.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{background:linear-gradient(145deg,#373634,#292929 74%);border:1px solid var(--line);border-radius:4px;padding:18px 19px;min-width:0}.panel p{margin:8px 0 14px}.panel .index{font:800 12px var(--mono);color:var(--yellow);letter-spacing:.1em;margin:0 0 12px}.accent{border-top:2px solid var(--red)}.mono{font-family:var(--mono)}.muted{color:var(--muted)}.chip{display:inline-block;color:#f6e4b4;background:#ffd33d0d;border-color:#ffd33d29}.chip.n{color:#ddd3c4;background:#ffffff09;border-color:var(--line)}.chip.r{color:#ffb8ad;background:#eb3c2a12;border-color:#ef695b55}.callout{border:1px solid #ffd33d44;background:#17161299;border-left:3px solid var(--yellow);padding:13px 16px;color:#f9e6ab;font-size:13px;line-height:1.5;margin:12px 0 0}.caption{font-size:12px;color:var(--muted);line-height:1.5}.metric{font:800 29px var(--mono);margin:12px 0 2px}.tablebox{background:#232323;border:1px solid var(--line);border-radius:4px;overflow:auto}.tbl{width:100%;border-collapse:collapse;text-align:left;min-width:570px}.tbl th{padding:12px 15px;background:#1c1c1c;color:#beb4a5;font:700 10px var(--mono);letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}.tbl td{padding:13px 15px;border-top:1px solid var(--line);line-height:1.35}.tbl td strong{display:block}.tbl tr:hover td{background:#ffffff05}.tbl .caption{margin-top:4px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:0 0 14px}.field{display:block;flex:1;min-width:158px}.field>span{display:block;color:#d5cbbb;margin-bottom:6px;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}select,input{width:100%;background:#202020;color:var(--ivory);border:1px solid #77736b;border-radius:3px;padding:10px 11px;min-height:40px}.arrow{color:var(--yellow);font-weight:900}.empty{padding:25px 18px;color:var(--muted)}.list{list-style:none;padding:0;margin:8px 0 0}.list li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.track-pane{background:#222;border:1px solid var(--line);padding:16px;border-radius:4px}.race{display:grid;grid-template-columns:minmax(0,1fr) 225px;gap:14px}.lanes{border:1px solid #77736b;border-radius:4px;overflow:hidden;position:relative;background:linear-gradient(110deg,#141414,#242424 68%,#1b1b1b);padding-right:15px}.lanes:after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#ddd0bd 0% 25%,#262626 0% 50%) 0/14px 14px;opacity:.7}.lane{height:55px;display:grid;grid-template-columns:134px minmax(0,1fr);align-items:center}.lane+.lane{border-top:1px dashed #ffffff30}.lane b{font-size:13px;padding-left:11px;white-space:nowrap}.lane-road{height:100%;position:relative;margin-right:5px;border-left:1px solid #ffffff36;background:linear-gradient(90deg,#ffffff00,#ffffff14,#ffffff00) center/100% 1px no-repeat}.racer{position:absolute;left:0;top:50%;transform:translate(8px,-50%);width:49px;height:29px;color:var(--team);z-index:1}.smoke{position:absolute;left:7px;top:50%;width:33px;height:15px;border-radius:100%;background:#ddd7c4a6;transform:translate(-2px,-50%) scale(.35);filter:blur(4px);opacity:0}.running .racer{animation:race 3.8s cubic-bezier(.18,.64,.32,1) both}.running .smoke{animation:smoke .95s ease-out 2}.done .racer{left:calc(100% - 54px)}@keyframes race{0%{left:0}12%{left:4%}30%{left:29%}100%{left:calc(100% - 54px)}}@keyframes smoke{0%{opacity:0;transform:translate(2px,-50%) scale(.3)}30%{opacity:.48}100%{opacity:0;transform:translate(-29px,-48%) scale(2.4)}}.race-result{padding:12px 13px;border:1px solid var(--line);background:#3a3936;border-radius:4px}.race-result b{font:700 10px var(--mono);color:var(--yellow);letter-spacing:.1em}.race-result p{font-size:12px;margin:9px 0;color:#ded4c5}.race-result p:before{content:"·";font-size:18px;color:var(--yellow);vertical-align:middle;margin-right:6px}.track-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.telemetry{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.telemetry .chip{color:#d2cabd}.pages{min-height:350px}.footer{display:flex;justify-content:space-between;gap:10px;padding-top:18px;margin-top:26px;border-top:1px solid var(--line);color:#a8a096;font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}.toast{position:fixed;bottom:24px;right:24px;z-index:9;max-width:370px;background:#181818;border:1px solid var(--yellow);padding:12px 17px;box-shadow:0 8px 24px #0008;border-radius:4px}.toast[hidden]{display:none}
@media(max-width:1050px){.grid{grid-template-columns:180px minmax(0,1fr)}.race{grid-template-columns:1fr}.race-result p{display:inline-block;margin:7px 9px 5px 0}.race-result b{display:block}.top .slashes{left:177px}}@media(max-width:760px){.grid{display:block}aside.side{top:58px;height:auto;z-index:4;display:flex;flex-direction:row;align-items:center;gap:0;padding:4px 6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex}.nav a{padding:8px;font-size:12px}.nav a svg{display:none}.nav-label,.side-foot,.top .slashes,.top .pill{display:none}.top{height:58px;padding:0 14px}.brand svg{width:33px;height:33px}.logo{font-size:27px}main{padding:16px 13px 30px}.heading{align-items:flex-start;flex-direction:column}.hero{padding:24px 19px}.hero p{max-width:370px}.panels,.panels.two{grid-template-columns:1fr}.lane{grid-template-columns:112px 1fr}.lane b{font-size:11px}.track-actions{align-items:flex-start;flex-direction:column}.footer{flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.running .racer{left:0}.running .smoke{display:none}}

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

<header class="top"><a href="#home" class="brand" aria-label="DASH Home"><svg aria-hidden="true"><use href="#mark"/></svg><span class="logo">DASH</span></a><div class="slashes" aria-hidden="true"></div><div class="top-end"><span class="pill"><i class="dot"></i> Design prototype</span><a href="#compare" class="btn primary small">+ New run</a></div></header>
<div class="grid"><aside class="side" aria-label="Workbench navigation"><div><p class="nav-label">WORKBENCH</p><nav class="nav" id="nav-work"></nav></div><div><p class="nav-label">ENVIRONMENT</p><nav class="nav" id="nav-env"></nav></div><div class="side-foot"><b>LOCAL PROTOTYPE</b>Nothing connected.<br>Nothing leaves this page.</div></aside>
<main><div class="wrap"><div id="pages" class="pages"></div><div class="footer"><span>DASH / Domain Assessment &amp; Scoring Harness</span><span>Offline design sample • No measured results</span></div></div></main></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const q=(s)=>document.querySelector(s), ui=q('#pages');
const routes={home:['Home','home'],compare:['Compare','compare'],datasets:['Datasets','database'],usecases:['Use Cases / Evaluators','case'],runs:['Runs','runs'],candidates:['Candidates / Providers','candidate'],settings:['Device & Settings','device']};
const nav=(keys)=>keys.map(k=> '<a href="#'+k+'" data-nav="'+k+'"><svg aria-hidden="true"><use href="#'+routes[k][1]+'-i"/></svg>'+routes[k][0]+'</a>').join('');
q('#nav-work').innerHTML=nav(['home','compare','datasets','usecases','runs']);q('#nav-env').innerHTML=nav(['candidates','settings']);
const state={scenario:'generic',candidate:'all',tab:'overview',running:false,preview:false,runScenario:'generic',timer:null};
const profiles={
generic:{title:'Domain evaluation',dataset:'Domain benchmark',datasetId:'domain-gold / draft',evaluator:'Domain quality',inputs:'Input · expectation',outcomes:['Required output produced','Unsupported claims','Human review needed']},
finance:{title:'Earnings extraction',dataset:'Earnings fixtures',datasetId:'earnings-fixture / draft',evaluator:'Earnings record checks',inputs:'Release excerpt · reference record',outcomes:['Analyst-ready records','False accepts','Analyst review rate']}
};
const labels=['Open Source','Frontier Labs','FineTuned'], colors=['#D82A1C','#FFF5E4','#FFD33D'];
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chip=(s,c='n')=>'<span class="chip '+c+'">'+esc(s)+'</span>';
const link=(name,to,c='')=>'<a class="btn '+c+'" href="#'+to+'">'+name+'</a>';
const act=(title,id,c='')=>'<button type="button" class="btn '+c+'" data-action="'+id+'">'+title+'</button>';
const crumb=(parts)=>'<div class="crumb"><a href="#home">DASH</a> / '+parts+'</div>';
function head(title,over,description,button=''){return '<div class="heading"><div><p class="kicker">'+over+'</p><h1 tabindex="-1">'+title+'</h1><p>'+description+'</p></div>'+button+'</div>';}
function card(n,title,body,button=''){return '<article class="panel accent"><div class="index">'+n+'</div><h2>'+title+'</h2><p>'+body+'</p>'+button+'</article>';}
function table(cols,rows){return '<div class="tablebox"><table class="tbl"><thead><tr>'+cols.map(x=>'<th scope="col">'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function section(title,sub,content,action=''){return '<section class="section"><div class="section-title"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+action+'</div>'+content+'</section>'}
const listitem=(l,r)=>'<li><span>'+l+'</span>'+r+'</li>';
function home(){return crumb('Home')+'<section class="hero"><div class="copy"><p class="kicker">Domain Assessment &amp; Scoring Harness</p><h1 tabindex="-1">Run domain evals.<br>Compare fast.</h1><p>Measure competing models and agents against the same task, evidence and evaluators.</p><div class="actions">'+link('Configure a comparison →','compare','primary')+link('Browse datasets','datasets','quiet')+'</div></div></section><div class="panels">'+card('01 / INPUT','Pick a dataset','Bring versioned examples and expected outcomes. Keep the inputs fixed across candidates.',link('Datasets →','datasets','small'))+card('02 / RULES','Choose evaluators','Score the business outcome first, then inspect quality failures and operating cost.',link('Use cases →','usecases','small'))+card('03 / RESULT','Inspect a run','Move from comparison history to a single case and its evidence.',link('Runs →','runs','small'))+'</div>'+section('Explore a sample','The platform opens in a generic mode. Finance is an optional scenario.','<div class="panel"><div class="section-title"><div><h2>Earnings extraction</h2><p>Illustrative analyst record checks; no company data or benchmark results.</p></div>'+act('Open finance example →','finance','small')+'</div></div>');}
function selectField(title,id,opts,val){return '<label class="field"><span>'+title+'</span><select id="'+id+'">'+opts.map(([v,n])=>'<option value="'+v+'"'+(v===val?' selected':'')+'>'+n+'</option>').join('')+'</select></label>';}
function race(p){return '<div class="track-pane"><div class="race"><div class="lanes '+(state.running?'running':state.preview?'done':'')+'" aria-hidden="true">'+labels.map((l,i)=>'<div class="lane"><b>'+l+'</b><div class="lane-road" style="--team:'+colors[i]+'"><span class="smoke"></span><svg class="racer"><use href="#car"/></svg></div></div>').join('')+'</div><div class="race-result"><b>EXAMPLE BUSINESS SIGNALS</b>'+p.outcomes.map(x=>'<p>'+x+'</p>').join('')+'</div></div><div class="track-actions"><span id="raceStatus" role="status" class="caption">'+(state.running?'Running visual preview…':state.preview?'Preview finished. No scores were generated.':'Three illustrative lanes. Motion is not a ranking.')+'</span><div class="actions" style="margin:0">'+(state.running?act('Stop preview','stop','small'):act(state.preview?'Replay preview':'Preview Run ▶','preview','primary small'))+(state.preview?link('Open demo run →','run','small'):'')+'</div></div></div>';}
function compare(){const p=profiles[state.scenario];return crumb('Compare')+head('Compare','01 / Configure','Set one dataset and one evaluation profile. Compare candidates under the same conditions.')+
'<div class="panel"><div class="toolbar">'+selectField('Use case','scenario',[['generic','Domain evaluation'],['finance','Earnings extraction · example']],state.scenario)+selectField('Dataset snapshot','dataset',[[p.datasetId,p.dataset+' · draft']],p.datasetId)+selectField('Evaluator profile','evaluation',[[p.evaluator,p.evaluator]],p.evaluator)+selectField('View candidate','candidate',[['all','All 3 demonstrators'],...labels.map(x=>[x,x])],state.candidate)+'</div><span class="caption">Selection affects the setup summary, not the three-lane animation. No model endpoints are invoked.</span></div>'+
section('Run preview',p.title+' · Same dataset for every candidate',race(p))+
section('Recorded signals','Display placeholders only. DASH would collect these when integrations are implemented.','<div class="telemetry">'+['Latency','Tokens','Cost','Memory','Energy'].map(x=>chip(x+'  —')).join('')+'</div><div class="callout">Energy stays unavailable unless measured. Idle baseline, runtime, device and instrumentation belong in the record.</div>','')+
section('Setup summary','',table(['Candidate','Dataset','Evaluator','Measured score'],(state.candidate==='all'?labels:[state.candidate]).map(l=>['<strong>'+l+'</strong>',p.dataset,p.evaluator,'<span class="muted">—</span>'])));}
function datasets(){return crumb('Datasets')+head('Datasets','02 / Inputs','Manage the inputs and expectations that make every run comparable.',act('Import dataset','import','primary'))+table(['Dataset','Snapshot','Contents','Status',''],Object.entries(profiles).map(([k,p])=>['<strong>'+p.dataset+'</strong>',p.datasetId,p.inputs,chip('Design fixture'),act('View setup →',k,'small')]))+
section('Fixture contract','', '<div class="panels two">'+card('01 / Required','Inputs & expectations','Store an input, a reference outcome or rubric, and a stable case ID. Keep audit references with source data.')+card('02 / Comparison','Frozen snapshots','Rerun the same snapshot before calling a change an improvement. Store rubric and candidate revisions with the run.')+'</div>');}
function usecases(){return crumb('Use Cases / Evaluators')+head('Use cases','03 / Evaluation','A use case defines the task and what the business considers a successful outcome.',link('Configure comparison →','compare','primary'))+'<div class="panels two">'+Object.entries(profiles).map(([k,p])=>card(k==='generic'?'01 / General':'02 / Finance example',p.title,p.outcomes.join(' · '),act('Use this profile →',k,'small'))).join('')+'</div>'+section('Evaluator registry','Business checks stay separate from operational signals.',table(['Evaluator','Type','What it checks','Readiness'],[['Required output','Deterministic','Schema or field coverage',chip('Illustrative')],['Evidence support','Rubric','Is the output supported by provided evidence?',chip('Illustrative')],['Human review gate','Policy check','Whether a record is safe to accept',chip('Illustrative')]]));}
function runs(){let p=profiles[state.runScenario];return crumb('Runs')+head('Runs','04 / History','Compare saved runs, then drill into case evidence.',link('+ New run','compare','primary'))+table(['Run','Use case','Scope','Status',''],[[state.preview?'<strong>Preview run A01</strong>':'<strong>Example run A01</strong>',p.title,'3 sample labels',chip(state.preview?'Preview complete':'Design sample'),link('Open run →','run','small')]])+'<div class="callout">Prototype state exists only in this browser tab. No actual run history or results are stored.</div>';}
function run(){let p=profiles[state.runScenario];return crumb('<a href="#runs">Runs</a> / A01')+head('Run A01','04 / Run detail',p.title+' · Visual design specimen. The rows below are placeholders, not test results.',link('Back to runs','runs','small'))+
'<div class="panels">'+card('DATASET',p.dataset,'Draft snapshot')+card('EVALUATION',p.evaluator,'Illustrative business rules')+card('STATUS',state.preview?'Preview complete':'Design sample','No execution or measurements')+'</div>'+
section('Cases','Open an example to see the evidence layout.',table(['Case','Input type','Output','Score',''],[['A01-001',p.inputs,'Not collected','—',link('Inspect case →','case','small')]]))+
section('Candidate overview','No winner without measured data.',table(['Candidate','Quality','Latency','Energy'],labels.map(x=>[x,'—','—','—'])));}
function casepage(){let p=profiles[state.runScenario];return crumb('<a href="#runs">Runs</a> / <a href="#run">A01</a> / Case A01-001')+head('Case A01-001','04 / Case detail',p.title+' · Placeholder structure, not a live evaluated example.',link('Back to run','run','small'))+
'<div class="panels two">'+card('01 / SOURCE','Input & reference',p.inputs+' would appear here. No example source or private documents are loaded.')+card('02 / RESPONSE','Candidate output','Outputs and evidence links appear only after a real invocation. None exists for this prototype.')+'</div>'+
section('Evaluation and trace','',table(['Detail','Value','State'],[['Business checks','—',chip('Not run')],['Tool calls','—',chip('Not collected')],['Memory / energy','—',chip('Not measured')]]));}
function candidates(){return crumb('Candidates / Providers')+head('Candidates','05 / Connections','Keep the deployable candidate separate from its model provider or execution runtime.',act('+ Add candidate','add','primary'))+
table(['Candidate','Illustrative role','Endpoint','Connection'],labels.map((l,i)=>['<strong>'+l+'</strong>',['Local model','Remote model provider','Adapted checkpoint'][i],'Not configured',chip('Not connected')]))+
section('Provider options','', '<div class="panels two">'+card('01 / LOCAL','On-device runtime','Model server or agent runtime lives outside DASH. The prototype does not detect or start it.')+card('02 / REMOTE','Provider connection','A configured endpoint and credentials would be required. No credentials are requested or stored here.')+'</div>');}
function settings(){return crumb('Device &amp; Settings')+head('Device &amp; settings','06 / Runtime','Inspect the information that should accompany reproducible results.')+
'<div class="panels two"><article class="panel accent"><div class="index">00 / DEVICE</div><h2>Runtime inspection</h2><ul class="list">'+listitem('Hardware',chip('Not detected'))+listitem('Model server',chip('Disconnected'))+listitem('Power instrumentation',chip('Unavailable'))+'</ul></article><article class="panel accent"><div class="index">01 / UI</div><h2>Preview preferences</h2><p>Animation respects your OS reduced-motion setting. The sample does not generate performance telemetry.</p>'+act('Check motion preference','motion','small')+'</article></div>'+
section('Prototype guardrails','', '<div class="callout">No files, API tokens, personal data or account permissions are required. This standalone HTML makes no network requests.</div>');}
const renderers={home,compare,datasets,usecases,runs,run,case:casepage,candidates,settings};
function current(){let k=location.hash.slice(1);return Object.hasOwn(renderers,k)?k:'home';}
let shown='';
function draw(focus=false){const k=current();ui.innerHTML=renderers[k]();document.title='DASH • '+(routes[k]?.[0]|| (k==='run'?'Run detail':'Case detail'));document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===(['run','case'].includes(k)?'runs':k)?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(k!==shown){scrollTo(0,0);shown=k;if(focus)ui.querySelector('h1')?.focus({preventScroll:true});}}
function note(m){let t=q('#toast');t.textContent=m;t.hidden=false;clearTimeout(note.timer);note.timer=setTimeout(()=>{t.hidden=true},3300);}
function stop(){clearTimeout(state.timer);state.running=false;draw();note('Preview stopped. Nothing was run.');}
function start(){state.preview=false;state.running=true;state.runScenario=state.scenario;draw();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;state.timer=setTimeout(()=>{state.running=false;state.preview=true;draw();if(current()==='compare')q('[data-action="preview"]')?.focus();},reduced?370:3800);if(current()==='compare')q('[data-action="stop"]')?.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='preview'){start();}else if(a==='stop'){stop();q('[data-action="preview"]')?.focus();}else if(a==='finance'||a==='generic'){state.scenario=a;state.candidate='all';if(current()!=='compare')location.hash='compare';else draw();}else if(a==='motion'){note('Your system reduced-motion setting is '+(matchMedia('(prefers-reduced-motion: reduce)').matches?'on.':'off.'));}else if(a==='import'){note('Dataset upload is not enabled in this standalone prototype.');}else if(a==='add'){note('Provider configuration is not enabled in this standalone prototype.');}});
ui.addEventListener('change',e=>{if(e.target.id==='scenario'||e.target.id==='candidate'){if(state.running){clearTimeout(state.timer);state.running=false;}if(e.target.id==='scenario')state.preview=false;const {id,value}=e.target;state[id]=value;draw();q('#'+id)?.focus();}});
window.addEventListener('hashchange',()=>{if(state.running&&current()!=='compare'){clearTimeout(state.timer);state.running=false;}draw(true);});
draw();
</script></body></html>
